<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图隐 DrawVeil</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="app.css">
</head>
<body class="plat-mac">
<header class="top pywebview-drag-region">
  <button type="button" class="ghost" id="b-back" hidden>‹ 返回</button>
  <div class="grow pywebview-drag-region"></div>
  <button type="button" class="iconbtn" id="b-theme" aria-label="切换到黑夜模式"></button>
</header>

<main>
  <!-- ① 拖入 -->
  <section class="view center" id="v-drop">
    <button type="button" class="ring" id="b-ring" aria-label="选择图纸"><svg viewBox="0 0 128 128" aria-hidden="true"><rect class="mk-sheet" x="20" y="20" width="88" height="88" rx="14" stroke-width="10"></rect><path d="M115 49 C 90 58, 66 80, 53 115 L94 115 A21 21 0 0 0 115 94 Z" class="mk-veil"></path></svg></button>
    <div class="stack">
      <h1>把图纸拖进来</h1>
      <p class="lead">DWG、DXF 或整个文件夹 · 图纸只在这台电脑上处理</p>
    </div>
    <div class="stack">
      <button type="button" class="pill" id="b-pick">选择图纸</button>
      <button type="button" class="link" id="b-pickdir">选择文件夹</button>
    </div>
  </section>

  <!-- 处理中 -->
  <section class="view center" id="v-busy" hidden>
    <div class="spin"><svg viewBox="0 0 128 128" aria-hidden="true"><rect class="mk-sheet" x="20" y="20" width="88" height="88" rx="14" stroke-width="10"></rect><path d="M115 49 C 90 58, 66 80, 53 115 L94 115 A21 21 0 0 0 115 94 Z" class="mk-veil"></path></svg></div>
    <div class="stack">
      <h1 id="busy-title">正在扫描</h1>
      <div class="busyline" id="busy-line" aria-live="polite"></div>
    </div>
  </section>

  <!-- ② 扫描结果 -->
  <section class="view scan" id="v-scan" hidden>
    <div class="stack">
      <div class="big" id="sc-total">0</div>
      <div style="font-size:17px" id="sc-sub"></div>
      <div class="muted" style="font-size:13px" id="sc-meta"></div>
    </div>
    <div class="bars" id="sc-bars"></div>
    <p class="warnline" id="sc-warn" hidden></p>
    <div class="stack">
      <button type="button" class="pill veil" id="b-apply">脱敏</button>
      <button type="button" class="link" id="b-review">逐项核对</button>
    </div>
  </section>

  <!-- ③ 逐项核对 -->
  <section class="view review" id="v-review" hidden>
    <div class="rvhead">
      <div><h1 id="rv-title">核对</h1><p>去掉勾就保留原文；点代号可以改</p></div>
      <label class="search"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"></circle><path d="M9.5 9.5 L13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg><input type="search" id="rv-q" placeholder="搜索" aria-label="搜索敏感词"></label>
    </div>
    <nav class="tabs" id="rv-tabs" aria-label="按类别筛选"></nav>
    <div class="list" id="rv-list"></div>
    <div class="rvfoot">
      <span class="muted" style="font-size:13px" id="rv-sum"></span>
      <button type="button" class="pill veil" id="b-apply2">脱敏</button>
    </div>
  </section>

  <!-- ④ 完成 -->
  <section class="view done" id="v-done" hidden>
    <span id="dn-icon"></span>
    <div class="stack">
      <h1 id="dn-title"></h1>
      <p class="lead" id="dn-sub" style="font-size:14px"></p>
    </div>
    <div class="checks" id="dn-checks"></div>
    <ul class="issues" id="dn-issues" hidden></ul>
    <div class="stack">
      <button type="button" class="pill" id="b-show">在访达中显示</button>
      <div class="links"><button type="button" class="link" id="b-report">查看报告</button><button type="button" class="link" id="b-again">再处理一批</button></div>
    </div>
  </section>

  <!-- 设置 -->
  <section class="view settings" id="v-set" hidden></section>
</main>

<footer class="foot" id="foot"></footer>
<button type="button" class="iconbtn gear" id="b-gear" aria-label="设置" title="设置"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M10.3 2.6h3.4l.5 2.6a7.4 7.4 0 0 1 1.9 1.1l2.5-.9 1.7 2.9-2 1.7a7.6 7.6 0 0 1 0 2.2l2 1.7-1.7 2.9-2.5-.9a7.4 7.4 0 0 1-1.9 1.1l-.5 2.6h-3.4l-.5-2.6a7.4 7.4 0 0 1-1.9-1.1l-2.5.9-1.7-2.9 2-1.7a7.6 7.6 0 0 1 0-2.2l-2-1.7 1.7-2.9 2.5.9a7.4 7.4 0 0 1 1.9-1.1z"></path><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"></circle></svg></button>
<div class="toast" id="toast" role="status" hidden></div>
<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="md-title"><h3 id="md-title"></h3><p id="md-text"></p><input class="field" id="md-input" hidden><div class="btns"><button type="button" class="btn" id="md-cancel">取消</button><button type="button" class="pill" style="height:34px;padding:0 18px;font-size:13px" id="md-ok">确定</button></div></div></div>
<script src="app.js"></script>
</body>
</html>

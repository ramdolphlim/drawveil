# 推送 v* 标签（例如 v1.0.0）时，打包 Mac 和 Windows 安装包并发布到 Releases
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '给已有版本补打包，例如 v1.0.0（留空只打包不发布）'
        required: false
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tests/run_tests.py
      - run: python tests/test_dwg_flow.py

  mac:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 版本号
        run: |
          T="${{ inputs.tag }}"; [ -n "$T" ] || { [ "$GITHUB_REF_TYPE" = tag ] && T="$GITHUB_REF_NAME"; } || true
          if [ -n "$T" ]; then V="${T#v}"; else V="0.0.0"; fi
          echo "V=$V" >> "$GITHUB_ENV"
      - run: pip install -r desktop/requirements.txt
      - name: 编译内置 LibreDWG（没装 ODA 时兜底读写 DWG）
        working-directory: desktop
        continue-on-error: true
        run: |
          brew install autoconf automake libtool pkg-config >/dev/null 2>&1 || true
          bash tools/fetch_libredwg.sh
          ./libredwg/dwg2dxf --version | head -1
      - name: 打包 .app 和 .dmg
        working-directory: desktop
        run: |
          sed -i '' "s/^APP_VERSION = \".*\"/APP_VERSION = \"$V\"/" drawveil_desktop.py
          EXTRA=()
          if [ -x libredwg/dwg2dxf ] && [ -x libredwg/dxf2dwg ]; then
            EXTRA+=(--add-binary "libredwg/dwg2dxf:libredwg" --add-binary "libredwg/dxf2dwg:libredwg" --add-data "libredwg/COPYING:libredwg" --add-data "libredwg/README.txt:libredwg")
          else
            echo "::warning::LibreDWG 没有编译成功，这个安装包只能靠 ODA 处理 DWG"
          fi
          pyinstaller --noconfirm --windowed --name "图隐" "${EXTRA[@]}" --icon assets/icon.icns \
            --osx-bundle-identifier cc.limch.drawveil \
            --add-data "ui:ui" --paths .. --hidden-import cad_desensitize drawveil_desktop.py
          PL="dist/图隐.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$PL" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $V" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 图隐 DrawVeil" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PL" || true
          codesign --force --deep --sign - "dist/图隐.app"
          mkdir -p dmg && cp -R "dist/图隐.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "DrawVeil" -srcfolder dmg -ov -format UDZO "DrawVeil-$V-mac-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: desktop/DrawVeil-*.dmg

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 版本号
        run: |
          T="${{ inputs.tag }}"; [ -n "$T" ] || { [ "$GITHUB_REF_TYPE" = tag ] && T="$GITHUB_REF_NAME"; } || true
          if [ -n "$T" ]; then V="${T#v}"; else V="0.0.0"; fi
          echo "V=$V" >> "$GITHUB_ENV"
      - run: pip install -r desktop/requirements.txt
      - name: 下载内置 LibreDWG（没装 ODA 时兜底读写 DWG）
        working-directory: desktop
        shell: pwsh
        continue-on-error: true
        run: ./tools/fetch_libredwg.ps1
      - name: 打包 .exe
        working-directory: desktop
        run: |
          N="${V%%-*}"; IFS=. read -r A B C <<< "$N"
          sed -i "s/^APP_VERSION = \".*\"/APP_VERSION = \"$V\"/" drawveil_desktop.py
          sed -i "s/1\.0\.0/$V/g; s/(1,0,0,0)/(${A:-0},${B:-0},${C:-0},0)/g" version_info.txt
          sed -i "s/^AppVersion=.*/AppVersion=$V/" installer.iss
          EXTRA=""
          if [ -f libredwg/dwg2dxf.exe ] && [ -f libredwg/dxf2dwg.exe ]; then EXTRA="--add-data libredwg;libredwg"; else echo "::warning::LibreDWG 没有下载成功，这个安装包只能靠 ODA 处理 DWG"; fi
          pyinstaller --noconfirm --windowed --name DrawVeil $EXTRA --icon assets/icon.ico \
            --add-data "ui;ui" --paths .. --hidden-import cad_desensitize --version-file version_info.txt drawveil_desktop.py
          7z a "DrawVeil-$V-win-x64-portable.zip" ./dist/DrawVeil/*
      - name: 生成安装程序
        working-directory: desktop
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/FDrawVeil-$env:V-win-x64-setup" "/O." installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/DrawVeil-*-win-x64-setup.exe
            desktop/DrawVeil-*-win-x64-portable.zip

  release:
    needs: [mac, windows]
    if: always() && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: out/*
          generate_release_notes: true
          body: |
            ## 下载

            | 系统 | 文件 |
            |---|---|
            | macOS（Apple 芯片） | `DrawVeil-*-mac-arm64.dmg` |
            | macOS（Intel 芯片） | `DrawVeil-*-mac-intel.dmg` |
            | Windows 10 / 11 | `DrawVeil-*-win-x64-setup.exe`（安装版）或 `*-portable.zip`（免安装） |

            程序没有开发者签名，第一次打开：macOS 在「应用程序」里右键「图隐」→ 打开（提示“已损坏”就在终端执行 `xattr -cr /Applications/图隐.app`）；Windows 点“更多信息”→“仍要运行”。

            **DWG 进、DWG 出**：装了免费的 [ODA File Converter](https://www.opendesign.com/guestfiles/oda_file_converter) 时，按原图版本写回 DWG（推荐）；没装时用安装包内置的 GNU LibreDWG（GPL-3.0）兜底，写出 DWG 2000。每张 DWG 写出后都会读回来核对图元数量和残留。网页版只支持 DXF：<https://drawveil.limch.cc>
